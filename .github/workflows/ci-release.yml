name: Xary CI & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: xary-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: xary-linux-x64
          - os: macos-latest
            artifact_name: xary-macos-x64

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: 🔨 Compile Binary
        run: cmake --build build --config Release

      - name: 🧪 Test CLI Binary Output & Prepare Artifact
        shell: bash
        run: |
          # Dynamically locate the built executable across OS generators
          if [ -f "build/Release/xary.exe" ]; then
            BIN="build/Release/xary.exe"
          elif [ -f "build/xary.exe" ]; then
            BIN="build/xary.exe"
          elif [ -f "build/Release/xary" ]; then
            BIN="build/Release/xary"
          elif [ -f "build/xary" ]; then
            BIN="build/xary"
          fi

          echo "Found binary at: $BIN"
          chmod +x "$BIN" 2>/dev/null || true
          
          # Run CLI smoke tests
          "$BIN" --version
          "$BIN" --help

          # Package for upload
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact_name }}"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/*

  release:
    name: 🚀 Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download All Compiled Artifacts
        uses: actions/download-artifact@v4

      - name: ⚡ Package Binary Assets
        run: |
          mkdir -p release_assets
          cp windows-latest-build/xary-windows-x64.exe release_assets/
          cp ubuntu-latest-build/xary-linux-x64 release_assets/
          cp macos-latest-build/xary-macos-x64 release_assets/

      - name: 📦 Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}