name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

# Required to allow GitHub Actions to attach binaries to your Releases
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows-x64.zip
          - os: ubuntu-latest
            artifact_suffix: linux-x64.tar.gz
          - os: macos-latest
            artifact_suffix: macos-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Binary
        run: cmake --build build --config Release --parallel

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item -Path "README.md", "LICENSE" -Destination staging/
          if (Test-Path "build/Release/xary.exe") {
            Copy-Item "build/Release/xary.exe" staging/
          } else {
            Copy-Item "build/xary.exe" staging/
          }
          Compress-Archive -Path "staging/*" -DestinationPath "xary-${{ github.ref_name }}-${{ matrix.artifact_suffix }}"

      - name: Package Linux / macOS Binary
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp README.md LICENSE staging/
          cp build/xary staging/
          tar -czvf "xary-${{ github.ref_name }}-${{ matrix.artifact_suffix }}" -C staging .

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "xary-${{ github.ref_name }}-${{ matrix.artifact_suffix }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}